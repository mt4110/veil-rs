name: Veil Security Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Versions
        run: |
          rustc -V
          cargo -V

      - name: Build the checked-out default local CLI
        run: cargo build --locked --release -p veil-cli --bin veil
      # Monitoring report (HTML)
      - name: Veil Scan (report)
        run: |
          target/release/veil scan crates/veil-core/src crates/veil-cli/src crates/veil-config/src --format html > "$RUNNER_TEMP/veil-report.html"

      # Monitor-only policy is preserved; this is not a release enforcement gate.
      - name: Veil Scan (enforce)
        run: |
          echo "Veil Scan (enforce) skipped as requested"
          # veil --no-color scan . --config veil.ci.toml --fail-on-severity High --format text

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veil-security-report
          path: ${{ runner.temp }}/veil-report.html
