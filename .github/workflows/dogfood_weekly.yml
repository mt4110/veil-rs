name: Weekly Dogfood

on:
  schedule:
    # 毎週 月曜 09:15 JST（= 00:15 UTC）
    - cron: 15 0 * * 1
  workflow_dispatch:
    inputs:
      week_id:
        description: "Override WEEK_ID (e.g., 2026-W03). Empty = auto"
        required: false
        default: ""

permissions: {}

concurrency:
  group: dogfood-weekly
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo
  # Git 2.52+ の「masterがデフォ」ヒントを出させない（runner context不要）
  GIT_CONFIG_GLOBAL: /tmp/.gitconfig_ci

jobs:
  dogfood-weekly:
    permissions:
      contents: read
    outputs:
      week_id: ${{ steps.week.outputs.week_id }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Prepare CI git config (avoid default-branch hint)
        shell: bash
        run: |
          set -euo pipefail
          cat > "$GIT_CONFIG_GLOBAL" <<'EOF'
          [init]
            defaultBranch = main
          [advice]
            defaultBranchName = false
          EOF

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          clean: true
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Compute WEEK_ID
        id: week
        env:
          REQUESTED_WEEK: ${{ inputs.week_id }}
        shell: bash
        run: |
          set -euo pipefail
          week="${REQUESTED_WEEK:-$(date +%G-W%V)}"
          if [[ ! "$week" =~ ^[0-9]{4}-W(0[1-9]|[1-4][0-9]|5[0-3])$ ]]; then
            echo "::error::week_id must be an ISO week such as 2026-W03"
            exit 1
          fi
          echo "WEEK_ID=$week" >> "$GITHUB_ENV"
          echo "week_id=$week" >> "$GITHUB_OUTPUT"
          echo "WEEK_ID=$week"

      - name: Run Dogfood Loop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_AUTH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist/cockpit-build
          nix build .#cockpit --out-link dist/cockpit-build

          OUTDIR="docs/dogfood/${WEEK_ID}-Tokyo"
          mkdir -p "$OUTDIR"

          ./dist/cockpit-build/bin/cockpit dogfood weekly 2>&1 | tee "$OUTDIR/run.log"

      - name: Phase 14 Analysis
        if: ${{ !cancelled() && steps.week.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x ./dist/cockpit-build/bin/cockpit ]]; then
            ./dist/cockpit-build/bin/cockpit dogfood analyze --week-id "$WEEK_ID"
          else
            echo "cockpit binary not found; skipping analyze"
          fi

      - name: Ensure Artifacts (Unbreakable Ritual)
        if: ${{ !cancelled() && steps.week.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_DIR="docs/dogfood/${WEEK_ID}-Tokyo"
          mkdir -p "$TARGET_DIR"

          REQUIRED_FILES=(
            "metrics_v1.json"
            "scorecard.txt"
            "run.log"
            "signals_v1.json"
            "INSIGHTS.md"
            "ACTIONS.md"
            "SUMMARY.md"
            "FIXLOG.md"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            FILEPATH="$TARGET_DIR/$file"
            if [[ ! -f "$FILEPATH" ]]; then
              echo "Creating placeholder for missing artifact: $file"
              case "$file" in
                *.json) printf "[]\n" > "$FILEPATH" ;;
                *) printf "status: failed\nreason: Artifact generation failed; see workflow logs and run.log\ntimestamp: %s\n" "$(date -Is)" > "$FILEPATH" ;;
              esac
            fi
          done

      - name: Upload dogfood artifacts
        id: artifact
        if: ${{ !cancelled() && steps.week.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dogfood-${{ steps.week.outputs.week_id }}-Tokyo
          path: docs/dogfood/${{ steps.week.outputs.week_id }}-Tokyo
          if-no-files-found: error

  publish-pr:
    needs: dogfood-weekly
    if: ${{ !cancelled() && needs.dogfood-weekly.outputs.artifact_id != '' }}
    runs-on: ubuntu-latest
    permissions: {}
    env:
      WEEK_ID: ${{ needs.dogfood-weekly.outputs.week_id }}
    steps:
      - name: Create scoped Dogfood GitHub App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOGFOOD_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOGFOOD_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}

      - name: Select weekly branch
        shell: bash
        run: |
          set -euo pipefail
          branch="dogfood/weekly-${WEEK_ID}"
          existing="$(git ls-remote --heads origin "refs/heads/$branch")"
          if [[ -n "$existing" ]]; then
            git fetch --no-tags origin "refs/heads/$branch"
            git switch -c "$branch" FETCH_HEAD
          else
            git switch -c "$branch"
          fi

      - name: Download weekly artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.dogfood-weekly.outputs.artifact_id }}
          path: docs/dogfood/${{ needs.dogfood-weekly.outputs.week_id }}-Tokyo

      - name: Publish weekly pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="dogfood/weekly-${WEEK_ID}"
          target="docs/dogfood/${WEEK_ID}-Tokyo"
          title="chore(dogfood): weekly ${WEEK_ID} Tokyo"
          git add -- "$target"
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "$title"
          fi
          if git diff --quiet origin/main HEAD -- "$target"; then
            echo "Weekly artifacts already match main."
            exit 0
          fi
          git push origin "HEAD:refs/heads/$branch"
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --head "$branch" --json url --jq '.[0].url // empty')"
          if [[ -n "$existing" ]]; then
            echo "Weekly pull request: $existing"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "$title" --body "Weekly Dogfood artifacts for ${WEEK_ID}."
          fi
