name: Release guardrails

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-ghost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Detect tracked macOS metadata files
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '(^|/)\.DS_Store$|(^|/)\._' || true)"
          if [ -n "$bad" ]; then
            echo "Forbidden macOS metadata files are tracked:"
            echo "$bad"
            exit 1
          fi
  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
      - name: Check supported CLI versions, toolchain, and release documents
        run: python scripts/check_cli_release.py
