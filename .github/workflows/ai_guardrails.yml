name: Release guardrails

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  mac-ghost:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect tracked macOS metadata files
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '(^|/)\.DS_Store$|(^|/)\._' || true)"
          if [ -n "$bad" ]; then
            echo "Forbidden macOS metadata files are tracked:"
            echo "$bad"
            exit 1
          fi
  version-sync:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.92.0
      - name: Check supported CLI versions, toolchain, and release documents
        run: python scripts/check_cli_release.py
