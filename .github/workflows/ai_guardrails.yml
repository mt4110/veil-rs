name: Release guardrails

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  mac-ghost:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Detect tracked macOS metadata files
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '(^|/)\.DS_Store$|(^|/)\._' || true)"
          if [ -n "$bad" ]; then
            echo "Forbidden macOS metadata files are tracked:"
            echo "$bad"
            exit 1
          fi
  version-sync:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.92.0
      - name: Check supported CLI versions, toolchain, and release documents
        run: python scripts/check_cli_release.py
