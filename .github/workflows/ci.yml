name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    uses: ./.github/workflows/ai_guardrails.yml
  msrv:
    name: MSRV (1.92.0)
    uses: ./.github/workflows/oss-profile.yml
    with:
      runner: ubuntu-latest
      toolchain: 1.92.0
  linux-musl:
    name: Static Linux musl (x86_64, 1.92.0)
    uses: ./.github/workflows/oss-profile.yml
    with:
      runner: ubuntu-latest
      toolchain: 1.92.0
      musl: true
  native:
    name: Native (${{ matrix.os }}, 1.92.0)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    uses: ./.github/workflows/oss-profile.yml
    with:
      runner: ${{ matrix.os }}
      toolchain: 1.92.0
