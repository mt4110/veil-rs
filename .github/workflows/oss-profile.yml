name: Local OSS profile

on:
  workflow_call:
    inputs:
      profile:
        type: string
        required: true
      runner:
        type: string
        required: true
      toolchain:
        type: string
        required: true
      musl:
        type: boolean
        default: false

permissions: {}

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: "1"
      LIBGIT2_NO_VENDOR: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ inputs.toolchain }}
          components: clippy, rustfmt
          targets: ${{ inputs.musl && 'x86_64-unknown-linux-musl' || '' }}
      - name: Install native musl C toolchain
        if: inputs.musl
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Architecture and release guard tests
        run: |
          python scripts/check_architecture.py
          python scripts/check_cli_release.py
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/check_docs_taxonomy.py
      - name: Default profile lint and tests
        run: |
          cargo clippy --locked --offline -p veil-cli -p veil-core -p veil-config --all-targets -- -D warnings
          cargo test --locked --offline
      - name: Minimal profile lint and tests
        run: |
          cargo clippy --locked --offline -p veil-cli -p veil-core -p veil-config --no-default-features --all-targets -- -D warnings
          cargo test --locked --offline -p veil-cli --no-default-features
      - name: Main feature and standalone LSP compatibility
        run: |
          cargo test --locked --offline -p veil-cli -p veil-core --features jp_mynumber_checksum
          cargo clippy --locked --offline -p veil-lsp --all-targets -- -D warnings
          cargo test --locked --offline -p veil-lsp
      - name: Release build
        if: ${{ !inputs.musl }}
        run: cargo build --locked --offline --release -p veil-cli --bin veil
      - name: Static musl release build
        if: inputs.musl
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
          RUSTFLAGS: -C target-feature=+crt-static
          ZLIB_STATIC: "1"
        run: |
          mkdir -p .local/ci
          cargo rustc --locked --offline --release -p veil-cli --bin veil --target x86_64-unknown-linux-musl -- -C "link-arg=-Wl,-Map,$PWD/.local/ci/musl-link.map"
      - name: Release binary smoke check
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
          MUSL_BUILD: ${{ inputs.musl }}
        run: |
          binary=target/release/veil
          if [ "$MUSL_BUILD" = "true" ]; then
            binary=target/x86_64-unknown-linux-musl/release/veil
          fi
          if [ "$RUNNER_OS_NAME" = "Windows" ]; then
            binary=target/release/veil.exe
          fi
          mkdir -p .local/ci
          python scripts/check_cli_release.py --binary "$binary" --bundle .local/ci/oss-release --archive .local/ci/oss-release.zip | tee .local/ci/oss-release-check.txt
      - name: Verify extracted native CLI archive and third-party notices
        env:
          MUSL_BUILD: ${{ inputs.musl }}
          RUNNER_CPU_ARCH: ${{ runner.arch }}
        run: |
          options=()
          if [ "$MUSL_BUILD" = "true" ]; then
            options+=(--require-static --link-map .local/ci/musl-link.map)
          fi
          python scripts/verify_cli_archive.py --archive .local/ci/oss-release.zip --report .local/ci/oss-archive-check.json --execution-mode native --execution-host-architecture "$RUNNER_CPU_ARCH" "${options[@]}"
      - name: First scan and staged workflow on release CLI
        run: |
          python scripts/check_staged_workflow.py --binary .local/ci/oss-release/veil | tee .local/ci/staged-workflow.json
      - name: Local installer acceptance on extracted CLI ZIP
        run: |
          python scripts/check_cli_install.py --archive .local/ci/oss-release.zip | tee .local/ci/installer-check.json
      - name: JA/EN installation to repeat-use acceptance
        run: |
          python scripts/check_cli_onboarding.py --archive .local/ci/oss-release.zip | tee .local/ci/onboarding-check.json
      - name: Upload CLI verification record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: veil-cli-check-${{ inputs.profile }}-${{ inputs.runner }}-${{ inputs.toolchain }}-${{ inputs.musl && 'musl' || 'native' }}
          path: |
            .local/ci/oss-release-check.txt
            .local/ci/oss-archive-check.json
            .local/ci/staged-workflow.json
            .local/ci/installer-check.json
            .local/ci/onboarding-check.json
            .local/ci/oss-release/SHA256SUMS
          if-no-files-found: error
