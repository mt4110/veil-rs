[package]
name = "veil-pro"
version = "0.17.0"
edition = "2021"
rust-version.workspace = true

[dependencies]
veil-core = { workspace = true }
veil-config = { workspace = true }
axum = "0.8.9"
tokio = { version = "1.54", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
schemars = { version = "1.2", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
rand = "0.10.3"
tower-http = { version = "0.7.1", features = ["fs", "cors", "trace"] }
base64 = "0.23.1"
open = "5.4.5"
clap = { version = "4.6.7", features = ["derive", "env"] }
uuid = { version = "1.29.2", features = ["v4"] }
chrono = "0.4.45"
sha2 = "0.11.1"
hex = "0.4.3"
zip = "9.5.0"
toml = "1.2.1"
rust-embed = "8.13.0"
oauth2 = "5.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
tower-sessions = "0.15.0"
mime_guess = "2.0.5"
utoipa = "6.0"
