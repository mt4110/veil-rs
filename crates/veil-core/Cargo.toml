[package]
name = "veil-core"
version = "0.22.2"
edition = "2021"
rust-version.workspace = true
license.workspace = true

[features]
default = []
jp_mynumber_checksum = []

[dependencies]
regex = "1.13.1"
thiserror = "2.0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.12"
ignore = "0.4"
veil-config = { path = "../veil-config" }
sha2 = "0.11"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
toml = "1.2"
rust-embed = "8.13"
blake3 = "1.8.7"
data-encoding = "2.11.1"
fs2 = "0.4.3"
tempfile = "3.27.0"
zip = "9.5.0"
hex = "0.4.3"

[dev-dependencies]
divan = "0.1"
tempfile = "3.27.0"
valico = "4.0.0"

[[bench]]
name = "scan_benchmark"
harness = false
