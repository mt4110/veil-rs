[package]
name = "veil-guardian"
version = "0.17.0"
edition = "2021"
rust-version.workspace = true
description = "Security advisory and policy enforcement module for Veil"
categories = ["development-tools"]

[dependencies]
json5 = "1.3"
serde = { version = "1.0", features = ["derive"] }
semver = "1.0"
serde_json = "1.0"
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
cargo-lock = "11.1"
thiserror = "2.0"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
directories = "6.0"
blake3 = "1.8"
hex = "0.4"
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3.34"
async-trait = "0.1"
fs2 = "0.4.3"

[dev-dependencies]
wiremock = "=0.6.5"
tempfile = "3.27"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
insta = "1.49.0"
