[package]
name = "veil-cli"
version = "0.22.1"
edition = "2021"
rust-version.workspace = true
license.workspace = true


[[bin]]
name = "veil"
path = "src/main.rs"

[features]
default = ["wizard", "table"]
wizard = []
table = ["dep:prettytable-rs"]
jp_mynumber_checksum = ["veil-core/jp_mynumber_checksum"]

[dependencies]
veil-core = { path = "../veil-core" }
veil-config = { path = "../veil-config" }
clap = { version = "4.6", features = ["derive", "env", "cargo"] }
colored = "3.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
chrono = "0.4"
indicatif = "0.18"
inquire = "0.9"
prettytable-rs = { version = "0.10", optional = true }
toml = "1.2"
rayon = "1.12"
ignore = "0.4"
regex = "1.13.1"
toml_edit = "0.25"
ctrlc = "3.5.2"
rust-embed = "8.13"
tempfile = "3.27"
ed25519-dalek = "3.0.0"
zip = "9.5.0"
hex = "0.4.3"

[dev-dependencies]
trycmd = "1.2"
assert_cmd = "2.2"
predicates = "3.1"
fs2 = { workspace = true }
zip = "9.5.0"
hex = "0.4.3"
sha2 = "0.11.1"
