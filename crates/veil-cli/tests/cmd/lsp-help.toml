bin.name = "veil"
args = ["--lang", "en", "lsp", "--help"]
status = "success"
stdout = """
Run the Veil language server over stdio

Usage: veil lsp [OPTIONS]

Options:
      --lang <LANG>
          Language for help (ja/en); does not translate scan output

      --preset <ID>
          Apply a built-in preset as the base config layer

  -c, --config <CONFIG>
          Path to config file (default: ./veil.toml)

  -h, --help
          Print help

      --no-color
          Disable colored output

  -q, --quiet
          Suppress non-essential output

Examples:
veil lsp --preset fintech-jp

Requires a separately installed veil-lsp on PATH. The CLI ZIP does not include the server; normal scans do not start it.
"""
stderr = ""
