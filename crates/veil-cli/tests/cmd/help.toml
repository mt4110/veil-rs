bin.name = "veil"
args = ["--lang", "en", "--help"]
status = "success"
stdout = """
Local secret scanning and masking

Usage: veil [OPTIONS] [COMMAND]

Commands:
  scan        Scan files and directories using local rules
  filter      Filter STDIN and mask secrets (outputs to STDOUT)
  init        Initialize a new configuration file
  config      Configuration tools
  pre-commit  Pre-commit hook tools
  git         Git history and operations
  doctor      Show diagnostic definition and system info
  rules       Rules related commands
  lsp         Run the Veil language server over stdio
  update      Install a local signed RulePack (requires --local-pack)
  verify      Verify an Evidence Pack v1 ZIP
  help        Print this message or the help of the given subcommand(s)

Options:
      --lang <LANG>
          Language for help (ja/en); does not translate scan output

  -c, --config <CONFIG>
          Path to config file (default: ./veil.toml)

      --no-color
          Disable colored output

  -q, --quiet
          Suppress non-essential output

  -h, --help
          Print help

  -V, --version
          Print version

Examples:
veil scan main.py --mask-mode redact --fail-on-findings 1
veil scan --staged --mask-mode redact --fail-on-findings 1

Exit codes: 0 below thresholds, 1 findings threshold, 2 error/incomplete scan. Ignored files and empty stages are not proof of safety. Help language does not translate reports or runtime errors.
"""
stderr = ""
